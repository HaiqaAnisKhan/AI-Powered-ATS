version: "3.9"

services:
  backend:
    build: ./backend
    container_name: resume-checker-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000

  frontend:
    build: ./frontend
    container_name: resume-checker-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend